# hardware: LED + button, MPU6050 + Si7021, LDR, GPS + terminal
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# floats: maths and printing decimals
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y

# SIMU mode prints only frames: no banner, no logs
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n

CONFIG_RING_BUFFER=y